<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对话框静态夹具（非运行时）</title>
<style>
  :root { --bg:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --hint:#86868b; --blue:#0071e3; --line:rgba(0,0,0,.08); }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink);
    font:13px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Microsoft YaHei', sans-serif; }
  .banner { display:flex; gap:10px; align-items:baseline; margin:0 0 14px; padding:10px 14px; border-radius:12px;
    background:#fff; box-shadow:inset 0 0 0 1px var(--line); font-size:12px; color:var(--muted); }
  .banner strong { color:var(--ink); font-size:12.5px; }
  .banner code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; color:#0071e3; }
  .cols { display:grid; gap:16px; }
  .row-solo { display:grid; }
  .row-pair { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .col { min-width:0; background:#fff; border-radius:16px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--line); }
  .col h2 { margin:0; padding:10px 14px; font-size:12px; font-weight:600; color:var(--muted); box-shadow:inset 0 -1px 0 var(--line); }
  .mount { display:flex; height:520px; min-height:0; }
  #full { height:760px; }
  .mount.short { height:380px; }
  @media (max-width: 900px) { .row-pair { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="banner">
  <strong>静态夹具 · NON-RUNTIME</strong>
  <span>数据来自 <code>docs/fixtures/dialog-fixture.mjs</code> 的样例事件；渲染走真实的 <code>buildDialogPlan</code> 与 <code>Conversation</code> 组件。
  没有连接任何 DSH 会话，不代表运行时行为，也不算验收通过。</span>
</div>
<div class="cols">
  <div class="row-solo">
    <div class="col"><h2>① 完整消息：用户 / 助手 / 流式 / 工具四态 / 审批四态 / 错误 / 解析失败</h2><div class="mount" id="full"></div></div>
  </div>
  <div class="row-pair">
    <div class="col"><h2>② 已绑定、无消息（空状态 + 3 条示例指令）</h2><div class="mount short" id="empty"></div></div>
    <div class="col"><h2>③ 未绑定（空状态）</h2><div class="mount short" id="unbound"></div></div>
  </div>
</div>
<script>
  // 与宿主同形的 module loader 桩：只提供 react，其余服务留空。
  window.__ModuleLoader__ = {
    load({ factory }) {
      window.__fixtureClient = factory(name => (name === 'react' ? window.React : {}));
    },
  };
</script>
<script src="../../plugin/dsh-media-image/node_modules/react/umd/react.development.js"></script>
<script src="../../plugin/dsh-media-image/node_modules/react-dom/umd/react-dom.development.js"></script>
<script src="../../plugin/dsh-media-image/lib/client.js"></script>
<script type="module" src="./dialog-fixture.mjs"></script>
</body>
</html>
